spring:
  application:
    name: lakehouse-flow
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
  datasource:
    url: jdbc:postgresql://localhost:5432/lakehouse_flow
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
  flyway:
    enabled: true
    schemas: public
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0

server:
  port: 8080
  servlet:
    context-path: /

lakehouse-flow:
  snapshot-sources:
    scanner:
      enabled: true
      fixed-delay-ms: 10000
      initial-delay-ms: 5000
    reconciliation:
      enabled: true
      fixed-delay-ms: 60000
      initial-delay-ms: 15000
    paimon:
      enabled: false
      zone-id: Asia/Shanghai
      catalogs: []
  scheduling-intent-outbox:
    enabled: true
    fixed-delay-ms: 1000
    batch-size: 100
  scheduling-intent-delivery:
    # One immutable intent selects exactly one outbound route.
    channel: ${LAKEHOUSE_FLOW_INTENT_CHANNEL:DATABASE_TABLE}
    destination: ${LAKEHOUSE_FLOW_INTENT_DESTINATION:scheduling_intent}
    publisher:
      enabled: true
      fixed-delay-ms: 1000
      batch-size: 100
      claim-lease: PT30S
      max-attempts: 8
      initial-backoff: PT1S
      maximum-backoff: PT5M
    metrics:
      fixed-delay-ms: 10000
  snapshot-confirmation:
    enabled: true
    fixed-delay-ms: 30000
    timeout: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

logging:
  level:
    root: INFO
    io.github.lakehouseflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/lakehouse-flow.log
    max-size: 10MB
    max-history: 10

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
