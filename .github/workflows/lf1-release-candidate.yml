name: LF-1.0 Release Candidate

on:
  workflow_dispatch:
  push:
    tags:
      - "v1.0.0-rc*"

permissions:
  contents: read

concurrency:
  group: lf-1.0-release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qualify-release-candidate:
    name: Full LF-1.0 Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: "**/pom.xml"

      - name: Validate LF-1.0 version line
        id: build
        shell: bash
        run: |
          VERSION=$(./mvnw -B -ntp help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            EXPECTED_VERSION="${GITHUB_REF_NAME#v}"
            test "$VERSION" = "$EXPECTED_VERSION"
          else
            [[ "$VERSION" =~ ^1\.0\.0(-rc[0-9]+|-SNAPSHOT)?$ ]]
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Run full unit and Testcontainers E2E verification
        run: ./mvnw -B -ntp clean verify

      - name: Verify executable Boot JAR and frozen contracts
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        run: |
          BOOT_JAR="lakehouse-flow-boot/target/lakehouse-flow-boot-${BUILD_VERSION}.jar"
          test -f "$BOOT_JAR"
          unzip -p "$BOOT_JAR" META-INF/MANIFEST.MF | grep -q '^Main-Class: org.springframework.boot.loader.launch.JarLauncher'
          unzip -p "$BOOT_JAR" META-INF/MANIFEST.MF | grep -q '^Start-Class: io.github.lakehouseflow.LakehouseFlowApplication'
          jar tf "$BOOT_JAR" > lakehouse-flow-boot/target/boot-jar-contents.txt
          grep -q '^BOOT-INF/lib/' lakehouse-flow-boot/target/boot-jar-contents.txt
          grep -q '^BOOT-INF/classes/contracts/lakehouse-flow/lf-1.0/rest-api-v1.surface.json$' lakehouse-flow-boot/target/boot-jar-contents.txt
          grep -q '^BOOT-INF/classes/contracts/lakehouse-flow/lf-1.0/scheduling-intent-1.3.schema.json$' lakehouse-flow-boot/target/boot-jar-contents.txt
          grep -q '^BOOT-INF/classes/contracts/lakehouse-flow/lf-1.0/job-control-intent-1.0.schema.json$' lakehouse-flow-boot/target/boot-jar-contents.txt

      - name: Assemble release candidate bundle
        shell: bash
        env:
          BUILD_VERSION: ${{ steps.build.outputs.version }}
        run: |
          mkdir -p release-bundle
          cp "lakehouse-flow-boot/target/lakehouse-flow-boot-${BUILD_VERSION}.jar" release-bundle/
          cp LICENSE README.md LF1_COMPATIBILITY.md SCHEDULING_INTENT_CONTRACT.md release-bundle/
          cp OPERATIONS_RUNBOOK.md DATABASE_OPERATIONS.md RELEASE_CHECKLIST.md release-bundle/
          {
            echo "Project: Lakehouse Flow"
            echo "Version: $BUILD_VERSION"
            echo "Build Date: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            echo "Git Commit: $GITHUB_SHA"
            echo "Git Ref: $GITHUB_REF"
            echo "Java: 17"
            echo "Verification: ./mvnw -B -ntp clean verify"
          } > release-bundle/BUILD_INFO.txt
          cd release-bundle
          sha256sum * > SHA256SUMS

      - name: Upload release candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: lakehouse-flow-lf-1.0-rc-${{ steps.build.outputs.short_sha }}
          if-no-files-found: error
          retention-days: 30
          path: release-bundle/

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lakehouse-flow-lf-1.0-reports-${{ steps.build.outputs.short_sha }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
            lakehouse-flow-service/target/site/jacoco/
